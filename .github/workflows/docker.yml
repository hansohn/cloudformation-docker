---
name: docker

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - '**'
  # Weekly refresh at 07:17 UTC. This image builds straight from debian and
  # nothing layers on it, so it shares the early slot with hansohn/terraform.
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

# Never cancel an in-flight publish on main; redundant feature branch builds
# are fair game.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  BUILD_CONTEXT: '.'
  DOCKER_PLATFORMS: 'linux/amd64,linux/arm64'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  # Verification only. Runs for any ref that is not the default branch, so
  # feature branches and dependency-update PRs are built but never published.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ lint ]
    if: github.ref_name != github.event.repository.default_branch
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare metadata
        id: prep
        run: |
          version=$(grep -E '^ARG AWSCLI_VERSION=' Dockerfile | head -1 | cut -d= -f2)
          {
            echo "version=${version}"
            echo "minor=${version%.*}"
            echo "major=${version%%.*}"
            echo "repo=${GITHUB_REPOSITORY%-docker}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.repo }}
          tags: |
            type=raw,value=${{ steps.prep.outputs.version }}
            type=raw,value=${{ steps.prep.outputs.minor }}
            type=raw,value=${{ steps.prep.outputs.major }}
            type=raw,value=latest

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILD_CONTEXT }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Build Summary
        run: |
          echo "### Build Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.prep.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** ${{ env.DOCKER_PLATFORMS }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Published:** no (verification build)" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Continuous delivery: the default branch is what ships. Every push to it
  # publishes, the weekly schedule republishes it to pick up base-image
  # security patches, and a manual dispatch on it forces a rebuild. The image
  # is built and pushed by a single buildx invocation, so a failed build
  # publishes nothing.
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ lint ]
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare metadata
        id: prep
        run: |
          version=$(grep -E '^ARG AWSCLI_VERSION=' Dockerfile | head -1 | cut -d= -f2)
          {
            echo "version=${version}"
            echo "minor=${version%.*}"
            echo "major=${version%%.*}"
            echo "repo=${GITHUB_REPOSITORY%-docker}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.repo }}
          tags: |
            type=raw,value=${{ steps.prep.outputs.version }}
            type=raw,value=${{ steps.prep.outputs.minor }}
            type=raw,value=${{ steps.prep.outputs.major }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILD_CONTEXT }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.prep.outputs.repo }}:${{ steps.prep.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Publish Summary
        run: |
          echo "### Publish Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.prep.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** ${{ env.DOCKER_PLATFORMS }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  dockerhub:
    name: Dockerhub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ publish ]
    if: needs.publish.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set DOCKER_REPO env
        run: echo "DOCKER_REPO=${GITHUB_REPOSITORY%-docker}" >> $GITHUB_ENV

      - name: Update dockerHub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_REPO }}
          short-description: ${{ github.event.repository.description }}

  slack:
    name: Slack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ build, publish, dockerhub ]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Slack Notification
        uses: Gamesight/slack-workflow-status@v2.0.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          channel: ${{ secrets.SLACK_CHANNEL_ID }}
          name: ${{ secrets.SLACK_USERNAME }}
          icon_url: "https://cdn-icons-png.flaticon.com/512/25/25231.png"
